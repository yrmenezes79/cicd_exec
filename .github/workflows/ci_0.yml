name: CI/CD - Testes Paralelos e Execução Python

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # FASE 1: CONTINUOUS INTEGRATION (CI) - Jobs rodando em paralelo
  # =========================================================================
  ci-lint-qualidade:
    name: CI - Lint (Flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar padrões de código nos arquivos Python
        run: |
          flake8 main.py test_main.py --max-line-length=100 --show-source --statistics

  ci-testes-unitarios:
    name: CI - Testes Automatizados (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar suíte de testes (test_main.py)
        run: |
          pytest test_main.py -v

  # =========================================================================
  # FASE 2: CONTINUOUS DEPLOYMENT / EXECUTION (CD) - Execução Sequencial Final
  # =========================================================================
  cd-execucao-producao:
    name: CD - Executar Programa Principal (main.py)
    # Só inicia quando os DOIS jobs paralelos de CI acima terminarem com sucesso
    needs: [ci-lint-qualidade, ci-testes-unitarios]
    # Em Pull Requests apenas valida o CI; só executa o CD ao fazer merge/push na main
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Checkout do código aprovado
        uses: actions/checkout@v4

      - name: Step 2 - Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Step 3 - Instalar bibliotecas do requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Step 4 - Executar main.py em Produção
        env:
          AMBIENTE: producao
        run: |
          python main.py
