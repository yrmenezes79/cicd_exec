
name: Pipeline Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Compilar e testar Java
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verificar Java e Maven
        run: |
          java -version
          mvn -version

      - name: Compilar e executar testes
        run: mvn -B clean verify

      - name: Publicar JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aplicacao-java
          path: target/pipeline-java-1.0.0.jar
          if-no-files-found: error
