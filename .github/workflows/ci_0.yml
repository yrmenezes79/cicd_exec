name: Deploy Infraestrutura AWS (Ansible)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy-s3:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Ansible e dependências
        run: |
          pip install ansible boto3 botocore
          ansible-galaxy collection install amazon.aws

      - name: Validar sintaxe do Playbook
        run: ansible-playbook --syntax-check create_bucket.yml

      - name: Executar Playbook na AWS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: us-east-1
        run: ansible-playbook create_bucket.yml

